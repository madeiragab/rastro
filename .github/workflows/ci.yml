name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    # PostGIS de verdade: a regra de geocerca É ST_Contains mais distância em
    # geography, então testar contra outro banco não testaria a regra.
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: rastro
          POSTGRES_PASSWORD: rastro
          POSTGRES_DB: rastro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rastro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: instalar dependências
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: testes
        working-directory: backend
        env:
          PYTHONPATH: .
          TEST_DATABASE_URL: postgresql+psycopg://rastro:rastro@localhost:5432/rastro_test
        run: pytest

      - name: migrações aplicam do zero e voltam
        working-directory: backend
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+psycopg://rastro:rastro@localhost:5432/rastro_migracoes
        # Vale por si: os testes criam o schema por metadata e não exercitam o
        # histórico de migrações, então uma revisão quebrada passaria batido.
        run: |
          python -c "
          from sqlalchemy import create_engine, text
          e = create_engine('postgresql+psycopg://rastro:rastro@localhost:5432/postgres', isolation_level='AUTOCOMMIT')
          with e.connect() as c:
              c.execute(text('CREATE DATABASE rastro_migracoes'))
          "
          alembic upgrade head
          alembic downgrade base

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: instalar dependências
        working-directory: frontend
        run: npm ci

      - name: typecheck e build
        working-directory: frontend
        run: npm run build

  imagens:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      # Constrói para provar que os Dockerfiles de produção funcionam.
      # Publicar em registry fica para quando houver ambiente de destino.
      - name: build da imagem da API
        run: docker build -t rastro-api:ci ./backend

      - name: build da imagem do frontend
        run: docker build -f frontend/Dockerfile.prod -t rastro-web:ci ./frontend
