# Cabeçalhos de segurança da resposta.
#
# Ficam num arquivo à parte e são incluídos em CADA `location` de propósito.
# No nginx, `add_header` não se acumula: um bloco que declara qualquer
# `add_header` próprio descarta todos os herdados do bloco de cima. Declarar
# uma vez no `server` parece funcionar e some silenciosamente nas rotas que
# definem cache — que são justamente o HTML principal e o Service Worker.

# Só é possível ser assim fechada porque nada vem de CDN: o único destino
# externo é o servidor de tiles do OpenStreetMap.
#
# `style-src 'unsafe-inline'` é necessário e não tem volta fácil: o React
# aplica `style={{...}}` como atributo, e atributo de estilo exige isso.
# Trocar por nonce significaria remover todo style inline do código.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self'; font-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
# A tela é um mapa de rebanho; nenhuma dessas capacidades faz sentido aqui.
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;
