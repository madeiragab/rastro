server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Não anuncia a versão do nginx.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Os arquivos de /assets carregam hash no nome, então podem ser guardados
    # para sempre: uma versão nova gera nome novo.
    location /assets/ {
        include /etc/nginx/seguranca.conf;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        try_files $uri =404;
    }

    # O Service Worker NUNCA pode ficar em cache. Um sw.js velho preso no
    # navegador continua rodando depois do deploy, e o usuário não tem como
    # perceber que está com a versão antiga.
    location = /sw.js {
        include /etc/nginx/seguranca.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/seguranca.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # O `try_files` do bloco abaixo cai aqui por redirecionamento interno, então
    # é ESTE bloco que decide os cabeçalhos do HTML principal.
    location = /index.html {
        include /etc/nginx/seguranca.conf;
        add_header Cache-Control "no-cache" always;
        expires off;
    }

    # SPA: qualquer rota desconhecida devolve o index, para /redefinir funcionar
    # ao ser aberto direto pelo link do e-mail.
    location / {
        include /etc/nginx/seguranca.conf;
        try_files $uri $uri/ /index.html;
    }
}
